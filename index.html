<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccpeek - Claude Chat History Viewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><style>path{fill:black}@media(prefers-color-scheme:dark){path{fill:white}}</style><path d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0e0e0e;
            color: #e3e3e3;
            height: 100vh;
            overflow: hidden;
        }

        /* App grid — 2-column layout */
        .app {
            display: grid;
            grid-template-columns: var(--sidebar-width, 280px) 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
            position: relative;
        }

        /* Row 1: top bar spans full width */
        .top-bar {
            grid-column: 1 / -1;
            min-height: 56px;
            background: #171717;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
        }

        .top-bar-logo {
            width: var(--sidebar-width, 280px);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #2a2a2a;
            flex-shrink: 0;
        }

        .top-bar-controls {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            min-width: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            display: flex;
            align-items: baseline;
            flex-shrink: 0;
        }

        .logo-cc {
            font-weight: 900;
            color: #fff;
        }

        .logo-peek {
            font-weight: 700;
            color: #999;
        }

        /* Row 2 col 1: conversation list */
        .conversations-pane {
            position: relative;
            overflow: hidden;
            background: #171717;
            border-right: 1px solid #2a2a2a;
        }

        .conversations-list {
            height: 100%;
            overflow-y: auto;
            padding: 8px;
            background: #171717;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .conversations-list::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .sidebar-scrollbar {
            position: absolute;
            top: 8px;
            right: 0;
            bottom: 8px;
            width: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 140ms ease;
        }

        .conversations-pane.show-scrollbar .sidebar-scrollbar.visible {
            opacity: 1;
        }

        .sidebar-scrollbar-thumb {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            border-radius: 4px;
            background: #3a3a3a;
            transition: background-color 140ms ease;
        }

        /* Row 2 col 2: main panel */
        .main-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conversation-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .conversation-item:hover {
            background: #1f1f1f;
        }

        .conversation-item.active {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }

        .conversation-item.matches-search {
            border-left: 3px solid #4a9eff;
        }

        .conversation-title {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .conversation-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            min-width: 0;
        }

        .conversation-title-row .conversation-title {
            margin-bottom: 0;
            min-width: 0;
            flex: 1;
        }

        .source-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 3px 7px 2px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .source-badge.claude {
            background: #2d241d;
            color: #e6b98a;
            border-color: #5c4533;
        }

        .source-badge.codex {
            background: #142333;
            color: #79c7ff;
            border-color: #294865;
        }

        .conversation-meta {
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-count {
            background: #4a9eff22;
            color: #4a9eff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .match-snippet {
            font-size: 12px;
            color: #888;
            margin: 4px 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .conv-header {
            height: 48px;
            padding: 0 12px;
            border-bottom: 1px solid #2a2a2a;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .resume-bar {
            padding: 8px 24px;
            border-bottom: 1px solid #2a2a2a;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .resume-bar.show {
            display: flex;
        }

        .resume-bar-label {
            color: #666;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .resume-bar-cmd {
            max-width: 100%;
            min-width: 0;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 6px 12px;
            color: #e3e3e3;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }

        .resume-bar-cmd:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }


        .resume-bar-copy {
            flex-shrink: 0;
            color: #666;
            font-size: 14px;
            display: flex;
            align-items: center;
            height: 14px;
        }

        .resume-bar-cmd:hover .resume-bar-copy {
            color: #999;
        }

        .resume-bar-cmd.copied {
            border-color: #4a9eff;
        }

        .resume-bar-cmd.copied .resume-bar-copy {
            color: #4a9eff;
        }

        .resume-bar-copy-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #4a9eff;
            white-space: nowrap;
        }

        .messages-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }
        .match-nav-bar {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: absolute;
            left: 10px;
            top: 10px;
            z-index: 10;
            font-size: 14px;
            color: #888;
        }
        .match-nav-bar.show { display: flex; }
        .match-nav-bar button {
            background: #1e1e1e;
            border: 1px solid #555;
            color: #ccc;
            width: 32px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
        }
        .match-nav-bar button:hover:not(:disabled) { background: #333; color: #fff; border-color: #777; }
        .match-nav-bar button:disabled { opacity: 0.25; cursor: not-allowed; }

        .sidebar-resize {
            width: 5px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
            position: absolute;
            top: 0;
            bottom: 0;
            left: var(--sidebar-width, 280px);
            z-index: 20;
            transform: translateX(-50%);
        }
        .sidebar-resize:hover, .sidebar-resize.dragging { background: #4a9eff; }
        .sidebar-dragging, .sidebar-dragging * { cursor: col-resize !important; user-select: none !important; }

        .global-search {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            min-width: 0;
            max-width: 600px;
            padding: 0 10px 0 14px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
        }

        .global-search textarea {
            width: 100%;
            min-width: 0;
            height: 40px;
            padding: 10px 0;
            background: transparent;
            border: none;
            box-sizing: border-box;
            color: #e3e3e3;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            overflow: hidden;
            min-height: 40px;
            line-height: 1.4;
            max-height: 120px;
            overflow-y: auto;
            display: block;
            margin: 0;
        }

        .header-title {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: 600;
        }
        
        .search-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: max-content;
        }

        .clear-search {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.2s;
            display: none;
        }

        .clear-search:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .clear-search.show {
            display: block;
        }

        .global-search textarea:focus {
            outline: none;
        }

        .global-search:focus-within {
            border-color: #4a4a4a;
            background: #0e0e0e;
        }

        .search-info {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
            min-width: max-content;
        }

        .search-nav {
            display: flex;
            gap: 4px;
        }

        .search-nav button {
            background: #2a2a2a;
            border: none;
            color: #999;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .search-nav button:hover:not(:disabled) {
            background: #3a3a3a;
            color: #fff;
        }

        .search-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .action-btn {
            background: none;
            border: 1px solid #2a2a2a;
            color: #999;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #2a2a2a;
            color: #fff;
            border-color: #3a3a3a;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px clamp(12px, 3vw, 24px);
            min-width: 0;
            font-size: 11pt;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            position: relative;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #4a5568;
        }

        .message.assistant .message-avatar {
            background: #d97706;
        }

        .message-content {
            flex: 1;
            min-width: 0;
            line-height: 1.6;
            position: relative;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .message-role {
            font-weight: 600;
            font-size: 14px;
        }

        .copy-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
            opacity: 0;
        }

        .message:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .copy-btn.copied {
            color: #4ade80;
        }

        .message-text {
            color: #d4d4d4;
            word-wrap: break-word;
        }

        .message.user .message-text {
            white-space: pre-wrap;
        }

        .message-text p {
            margin-bottom: 1em;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text h2 {
            font-size: 1.25em;
        }

        .message-text a {
            color: #c9a96e;
            text-decoration: underline;
        }

        .message-text ul,
        .message-text ol {
            padding-left: 1.5em;
            margin: 1em 0;
        }

        .message-text li {
            margin: 0;
        }

        .message-text ul li ~ li,
        .message-text ol li ~ li {
            margin: 0.5em 0;
        }

        h3 {
            margin: 0.5em 0;
        }

        hr {
            margin: 1em 0;
        }

        .message-text table {
            border-collapse: collapse;
            margin: 1.5em 0;
        }

        .message-text th,
        .message-text td {
            border: 1px solid #444;
            padding: 6px 10px;
        }

        .message-text th {
            background: #1a1a1a;
        }

        .message-text code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }

        .message-text pre {
            background: #141414;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            position: relative;
            padding: 0;
        }

        .message-text pre code {
            display: block;
            background: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message-text pre code.hljs {
            background: #141414;
        }
        
        .thinking-block {
            background: #1a1f2e;
            border: 1px solid #2a3f5f;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            font-style: italic;
            font-size: 9.5pt;
            color: #9ca3af;
            position: relative;
            white-space: pre-wrap;
        }

        .thinking-content {
            max-height: 200px;
            overflow: hidden;
            position: relative;
            opacity: 0.65;
            transition: opacity 0.15s, max-height 150ms ease-out;
        }

        .thinking-block:hover .thinking-content,
        .thinking-block.expanded .thinking-content,
        .thinking-all-expanded .thinking-content {
            opacity: 1;
        }

        .thinking-content.needs-fade::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, #1a1f2e);
            pointer-events: none;
        }

        .thinking-block.expanded .thinking-content,
        .thinking-all-expanded .thinking-content {
            overflow: visible;
        }

        .thinking-block.expanded .thinking-content::after,
        .thinking-all-expanded .thinking-content::after {
            display: none;
        }

        .thinking-block.expanded .thinking-content.needs-fade ~ .thinking-expand,
        .thinking-all-expanded .thinking-content.needs-fade ~ .thinking-expand {
            visibility: hidden;
        }

        .thinking-expand {
            display: none;
            text-align: center;
            padding: 6px 0;
            margin-top: 2px;
            cursor: pointer;
            color: #6b7280;
            font-size: 14px;
            font-style: normal;
            user-select: none;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(128, 168, 255, 0.1);
            border-radius: 4px;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .thinking-expand:hover {
            color: #9ca3af;
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(128, 168, 255, 0.2);
        }

        .thinking-content.needs-fade ~ .thinking-expand {
            display: block;
        }

        .thinking-header {
            color: #6b7280;
            margin-bottom: 8px;
            font-weight: bold;
            font-style: normal;
        }

        .tool-use {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            margin: 8px 0;
            overflow: hidden;
        }

        .tool-use-header {
            font-size: 12px;
            color: #999;
            padding: 8px 12px;
            background: #0e0e0e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
            user-select: none;
        }

        .tool-use-header:hover {
            background: #1a1a1a;
        }

        .tool-use-content {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #a8a8a8;
            padding: 12px;
            white-space: pre-wrap;
        }

        .json-key { color: #a7bdb8; }
        .json-string { color: #b5cea8; }
        .json-number { color: #dcdcaa; }
        .json-bool { color: #569cd6; }
        .json-null { color: #569cd6; }
        .json-escape { color: #8c9bb6; }

        .tool-use.collapsed .tool-use-content {
            display: none;
        }

        .tool-use-toggle {
            font-size: 10px;
            color: #666;
        }

        .highlight {
            background: #4a2a0e;
            color: #ddd;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 500;
        }

        .highlight.current, .conversations-list .highlight {
            background: #fbbf24;
            color: #000;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: #999;
        }

        .timestamp {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .message.tool-filtered {
            display: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }

        .sidebar-scrollbar-thumb:hover {
            background-color: rgba(74, 74, 74, 1);
        }

        /* Keyboard shortcuts help */
        .shortcuts-help {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            color: #666;
            display: none;
        }

        .shortcuts-help.show {
            display: block;
        }

        /* Back button (hidden on desktop) */
        .back-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        /* ── Narrow ── */
        .show-hide-prefix { display: none; }

        @media (max-width: 1024px) {
            .search-nav { display: none; }
        }

        @media (max-width: 800px) {
            .search-info { display: none !important; }
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            .sidebar-resize { display: none; }

            /* Top bar stacks vertically */
            .top-bar {
                flex-wrap: wrap;
                height: auto;
            }

            .top-bar-logo {
                width: 100%;
                height: 48px;
                border-right: none;
                border-bottom: 1px solid #2a2a2a;
            }

            .top-bar-controls {
                padding: 8px 12px;
            }

            .global-search { max-width: none; }

            .global-search {
                padding: 0 8px 0 12px;
            }

            .global-search textarea { font-size: 16px; line-height: 1; padding: 0.7em 0; }

            /* Hide desktop-only buttons on mobile */
            #filterBtn, #exportBtn {
                display: none !important;
            }

            #agentBtn {
                font-size: 12px;
                padding: 6px 10px;
                white-space: nowrap;
            }

            /* List */
            .conversations-pane { border-right: none; }

            /* Viewing a conversation: swap list for messages */
            .app.viewing-conv .conversations-pane { display: none; }
            .app.viewing-conv .top-bar { display: none; }
            .app.viewing-conv .main-panel { display: flex; }
            .app.viewing-conv .conv-header { display: flex; }

            .back-btn { display: flex; }

            .resume-bar { display: none !important; }

            .main-panel { display: none; }

            .messages-container { padding: 16px 12px; }
            .message { gap: 10px; }
            .message-avatar { width: 28px; height: 28px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="sidebar-resize" id="sidebarResize"></div>
        <!-- Row 1: top bar -->
        <div class="top-bar">
            <div class="top-bar-logo">
                <div class="logo">
                    <span class="logo-cc">cc</span><span class="logo-peek">peek</span>
                </div>
            </div>
            <div class="top-bar-controls">
                <div class="global-search">
                    <textarea id="globalSearch" rows="1" placeholder="Search everything... (Press '/' to focus)"></textarea>
                    <div class="search-controls">
                        <button class="clear-search" id="clearSearch" onclick="clearSearch()">✕</button>
                        <div class="search-info" id="searchInfo">
                            <span id="searchCount">0/0</span>
                            <div class="search-nav">
                                <button onclick="navigateSearch('prev')" id="prevBtn">↑</button>
                                <button onclick="navigateSearch('next')" id="nextBtn">↓</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="action-btn" onclick="toggleAgentThreads()" id="agentBtn">
                    <span id="agentIcon">🕵🏻</span> <span id="agentBtnText"><span class="show-hide-prefix">Show </span>Agents</span>
                </button>
                <button class="action-btn" onclick="toggleThinking()" id="thinkingBtn" style="display: none;">
                    <span id="thinkingIcon">💭</span> <span id="thinkingBtnText"><span class="show-hide-prefix">Show </span>Thinking</span>
                </button>
                <button class="action-btn" onclick="toggleFilter()" id="filterBtn" style="display: none;">
                    <span id="filterIcon">🔧</span> <span id="filterBtnText"><span class="show-hide-prefix">Show </span>Tools</span>
                </button>
                <button class="action-btn" onclick="exportConversation()" id="exportBtn" style="display: none;">
                    <span>📥</span> Export
                </button>
            </div>
        </div>

        <!-- Row 2: list + conversation -->
        <div class="conversations-pane" id="conversationsPane">
            <div class="conversations-list" id="conversationsList">
                <div class="loading">Loading conversations...</div>
            </div>
            <div class="sidebar-scrollbar" id="sidebarScrollbar">
                <div class="sidebar-scrollbar-thumb" id="sidebarScrollbarThumb"></div>
            </div>
        </div>

        <div class="main-panel">
            <!-- Mobile-only header: back button + title + show tools -->
            <div class="conv-header" id="convHeader">
                <button class="back-btn" onclick="history.back()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <span class="header-title truncate" id="headerTitle"></span>
                <button class="action-btn" onclick="toggleFilter()" id="filterBtnMobile" style="display: none;">
                    <span id="filterIconMobile">🔧</span> Tools
                </button>

            <div class="resume-bar" id="resumeBar">
                <span class="resume-bar-label" id="resumeBarLabel">To resume:</span>
                <div class="resume-bar-cmd" id="resumeCmd" onclick="copyResumeCommand()">
                    <span class="resume-bar-cmd-text truncate" id="resumeCmdText"></span>
                    <span class="resume-bar-copy" id="resumeCopyIcon">✂</span>
                    <span class="resume-bar-copy-label" id="resumeCopyLabel"></span>
                </div>
            </div>
            <div class="messages-wrap">
                <div class="match-nav-bar" id="matchNavBar">
                    <button onclick="navigateSearch('prev')" id="matchNavPrev" disabled>&#129093;</button>
                    <button onclick="navigateSearch('next')" id="matchNavNext" disabled>&#129095;</button>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state">
                        <h2>Select a conversation</h2>
                        <p>Choose a conversation from the sidebar to view its messages</p>

    </div>


    <div class="shortcuts-help" id="shortcutsHelp">
        <strong>Keyboard Shortcuts:</strong><br>
        / - Search<br>
        Esc - Clear search<br>
        j/k - Navigate chats<br>
        Enter - Open chat<br>
        n/p - Next/prev result<br>
        ? - Toggle help
    </div>

    <script src="/search-input-controller.js"></script>
    <script>
        let allConversations = [];
        let currentConversation = null;
        let allMessages = [];
        let searchResults = [];
        let currentSearchIndex = 0;
        let searchTerm = '';
        let selectedConvIndex = 0;
        let filterToolsEnabled = true;
        let showAgentThreads = false;
        let includeThinking = false;
        let searchDebounceTimer = null;
        let rawSearchMatches = {};
        let currentMatchType = 'phrase';
        let currentTokens = [];
        let convAbort = null;
        let searchAbort = null;
        let pendingLastMatch = false;
        let conversationListEtag = '';
        const searchClientId = window.crypto?.randomUUID?.() ||
            `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        let searchRequestSeq = 0;

        function filterAgentThreads(conversations) {
            if (showAgentThreads) return conversations;
            return conversations.filter(c => !c.parent_id);
        }

        function getSourceLabel(source) {
            return source === 'codex' ? 'Codex' : 'Claude';
        }

        function renderSourceBadge(source) {
            const cls = source === 'codex' ? 'codex' : 'claude';
            return `<span class="source-badge ${cls}">${escapeHtml(getSourceLabel(source))}</span>`;
        }

        function updateHeaderTitle(conv) {
            const title = document.getElementById('headerTitle');
            if (!conv) {
                title.textContent = '';
                return;
            }
            title.innerHTML = `${escapeHtml(conv.title)} ${renderSourceBadge(conv.source)}`;
        }

        // Load conversations on startup
        async function loadConversations() {
            try {
                const headers = conversationListEtag
                    ? { 'If-None-Match': conversationListEtag }
                    : {};
                const response = await fetch('/api/conversations?include_internal=true', { headers });
                if (response.status === 304) {
                    return false;
                }
                const nextConversations = await response.json();
                const changed = true;
                conversationListEtag = response.headers.get('ETag') || '';
                allConversations = nextConversations;
                if (changed) {
                    renderConversations(filterAgentThreads(allConversations));
                }
                return changed;
            } catch (error) {
                console.error('Error loading conversations:', error);
                conversationListEtag = '';
                document.getElementById('conversationsList').innerHTML =
                    '<div class="empty-state"><p>Error loading conversations</p></div>';
                return true;
            }
        }

        function renderConversations(conversations, searchMatches = {}) {
            const container = document.getElementById('conversationsList');

            if (conversations.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No conversations found</p></div>';
                requestAnimationFrame(updateSidebarScrollbar);
                return;
            }

            container.innerHTML = conversations.map(conv => {
                const date = new Date(conv.timestamp || conv.modified * 1000);
                const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                const matchData = searchMatches[conv.id];
                const hasMatches = matchData && (
                    typeof matchData === 'object'
                        ? (matchData.count > 0 || matchData.titleMatch)
                        : matchData > 0
                );
                const matchCount = matchData ? (typeof matchData === 'object' ? matchData.count : matchData) : 0;
                const rawSnippet = matchData && typeof matchData === 'object' ? matchData.snippet : '';
                const snippet = centerSnippet(rawSnippet, matchData?.tokens || searchTerm);
                const matchLabel = !hasMatches ? '' :
                    (matchData?.titleMatch && matchCount === 0
                        ? 'title match'
                        : `${matchCount} ${matchData?.wordCount === 0 ? 'partial ' : ''}match${matchCount === 1 ? '' : 'es'}`);

                return `
                    <div class="conversation-item ${hasMatches ? 'matches-search' : ''} ${conv.id === currentConversation ? 'active' : ''}"
                         data-id="${conv.id}"
                         onclick="loadConversation('${conv.id}')">
                        <div class="conversation-title-row">
                            <div class="conversation-title truncate">${hasMatches && searchTerm ? highlightSidebar(escapeHtml(conv.title), matchData) : escapeHtml(conv.title)}</div>
                            ${renderSourceBadge(conv.source)}
                        </div>
                        ${hasMatches && snippet ? `<div class="match-snippet">${searchTerm ? highlightSidebar(escapeHtml(snippet), matchData) : escapeHtml(snippet)}</div>` : ''}
                        <div class="conversation-meta">
                            <span>${dateStr}</span>
                            ${hasMatches ? `<span class="match-count">${matchLabel}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            syncSelectedConvIndex();
            requestAnimationFrame(updateSidebarScrollbar);
        }

        function syncSelectedConvIndex() {
            const items = Array.from(document.querySelectorAll('.conversation-item'));
            if (items.length === 0) {
                selectedConvIndex = 0;
                return;
            }

            const activeIndex = items.findIndex(item => item.getAttribute('data-id') === currentConversation);
            selectedConvIndex = activeIndex >= 0 ? activeIndex : 0;
        }

        function scrollConversationIntoView(conversationId, smooth = false) {
            const item = Array.from(document.querySelectorAll('.conversation-item'))
                .find(el => el.getAttribute('data-id') === conversationId);
            if (item) {
                item.scrollIntoView({ behavior: smooth ? 'smooth' : 'instant', block: 'nearest' });
                requestAnimationFrame(updateSidebarScrollbar);
            }
        }

        function updateSidebarScrollbar() {
            const container = document.getElementById('conversationsList');
            const scrollbar = document.getElementById('sidebarScrollbar');
            const thumb = document.getElementById('sidebarScrollbarThumb');
            if (!container || !scrollbar || !thumb) return;

            const visibleHeight = container.clientHeight;
            const totalHeight = container.scrollHeight;
            const scrollable = totalHeight - visibleHeight;

            if (scrollable <= 0 || visibleHeight <= 0) {
                scrollbar.classList.remove('visible');
                thumb.style.height = '0';
                thumb.style.transform = 'translateY(0)';
                return;
            }

            const trackHeight = scrollbar.clientHeight;
            const thumbHeight = Math.max(24, Math.round(trackHeight * (visibleHeight / totalHeight)));
            const maxThumbTop = Math.max(0, trackHeight - thumbHeight);
            const thumbTop = Math.round((container.scrollTop / scrollable) * maxThumbTop);

            thumb.style.height = `${thumbHeight}px`;
            thumb.style.transform = `translateY(${thumbTop}px)`;
            scrollbar.classList.add('visible');
        }

        async function loadConversation(conversationId, options = {}) {
            const { scrollSidebar = false, smoothScroll = false } = options;
            if (convAbort) convAbort.abort();
            convAbort = new AbortController();
            const signal = convAbort.signal;

            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-id="${conversationId}"]`)?.classList.add('active');

            currentConversation = conversationId;
            syncSelectedConvIndex();
            if (scrollSidebar) {
                scrollConversationIntoView(conversationId, smoothScroll);
            }

            const conv = allConversations.find(c => c.id === conversationId);
            updateHeaderTitle(conv);

            if (isMobile()) {
                document.getElementById('app').classList.add('viewing-conv');
                if (history.state?.conv !== conversationId) {
                    history.pushState({ conv: conversationId }, '');
                }
            }
            document.getElementById('exportBtn').style.display = 'block';
            document.getElementById('filterBtn').style.display = 'block';
            document.getElementById('filterBtnMobile').style.display = 'block';
            document.getElementById('thinkingBtn').style.display = 'none';

            document.getElementById('messagesContainer').innerHTML = '<div class="loading">Loading messages...</div>';

            try {
                const response = await fetch(
                    `/api/conversation/${conversationId}?include_internal=true`,
                    { signal });
                const data = await response.json();

                if (currentConversation !== conversationId) return;

                if (data.error) {
                    let errorMsg = data.error;
                    if (data.conversation_id) {
                        errorMsg += ` (${data.conversation_id})`;
                    }
                    document.getElementById('messagesContainer').innerHTML =
                        `<div class="empty-state"><p>${escapeHtml(errorMsg)}</p></div>`;
                    return;
                }

                allMessages = data;
                updateResumeBar();
                document.getElementById('thinkingBtn').style.display =
                    allMessages.some(msg => msg.kind === 'thinking' && !msg.hidden_by_default) ? 'block' : 'none';

                if (searchTerm) {
                    const matchData = rawSearchMatches[conversationId];
                    if (matchData?.match_type === 'all_terms' && matchData.tokens) {
                        currentMatchType = 'all_terms';
                        currentTokens = matchData.tokens;
                    } else {
                        currentMatchType = 'phrase';
                        currentTokens = [];
                    }
                    updateMessageSearchResults();
                } else {
                    renderMessages(allMessages);
                }
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error('Error loading conversation:', error);
                document.getElementById('messagesContainer').innerHTML =
                    `<div class="empty-state"><p>Error loading conversation: ${escapeHtml(conversationId)}</p><p style="font-size: 12px; color: #666; margin-top: 8px;">${escapeHtml(error.message || 'Network error')}</p></div>`;
            }
        }

        let globalMatchIndex = 0;

        function renderMessages(messages, highlightTerm = '') {
            globalMatchIndex = 0;
            const container = document.getElementById('messagesContainer');

            const messageHtml = messages.map((msg, index) => {
                return renderMessage(msg, index, highlightTerm);
            }).filter(html => html).join('');

            container.innerHTML = messageHtml || '<div class="empty-state"><p>No messages in this conversation</p></div>';
            
            // Mark thinking blocks that overflow 200px so they get the fade + caret
            container.querySelectorAll('.thinking-content').forEach(el => {
                el.classList.toggle('needs-fade', el.scrollHeight > 200);
            });

            // Preserve expand-all state across re-renders
            container.classList.toggle('thinking-all-expanded', includeThinking);
        }

        function stripInlineMarkdown(text) {
            text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, '$1');
            text = text.replace(/`([^`]+)`/g, '$1');
            text = text.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
            text = text.replace(/(?<!\w)(\*{1,3}|_{1,3}|~~)(.*?)\1(?!\w)/g, '$2');
            return text;
        }

        function searchTermToPattern(term, forHtml) {
            const broad = forHtml
                ? '(?:\\n|\\\\n|<br\\s*/?>\\s*|\\s+)'
                : '(?:\\n|\\\\n|\\s+)';
            const narrow = forHtml
                ? '(?:\\n|<br\\s*/?>\\s*|\\s+)'
                : '(?:\\n|\\s+)';
            const result = [];
            let i = 0;
            while (i < term.length) {
                if (i + 1 < term.length && term[i] === '\\' && term[i + 1] === 'n') {
                    result.push(broad);
                    i += 2;
                } else if (term[i] === '\n') {
                    result.push(narrow);
                    i += 1;
                } else {
                    let j = i + 1;
                    while (j < term.length) {
                        if (term[j] === '\n') break;
                        if (j + 1 < term.length && term[j] === '\\' && term[j + 1] === 'n') break;
                        j++;
                    }
                    result.push(escapeRegex(term.slice(i, j)));
                    i = j;
                }
            }
            return result.join('');
        }

        function searchTermToSnippetPattern(term) {
            const result = [];
            let i = 0;
            while (i < term.length) {
                if (i + 1 < term.length && term[i] === '\\' && term[i + 1] === 'n') {
                    i += 2;
                } else if (term[i] === '\n') {
                    i += 1;
                } else {
                    let j = i + 1;
                    while (j < term.length) {
                        if (term[j] === '\n') break;
                        if (j + 1 < term.length && term[j] === '\\' && term[j + 1] === 'n') break;
                        j++;
                    }
                    result.push(escapeRegex(term.slice(i, j)));
                    i = j;
                }
            }
            return result.join('|');
        }

        function centerSnippet(snippet, term) {
            if (!term || !snippet) return snippet;
            const tokens = Array.isArray(term) ? term : [term];
            const stripped = snippet.replace(/^\.{3}/, '').replace(/\.{3}$/, '');
            const hadLeadingEllipsis = snippet.startsWith('...');
            const lower = stripped.toLowerCase();
            let earliest = -1;
            for (const tok of tokens) {
                const idx = lower.indexOf(tok.toLowerCase());
                if (idx !== -1 && (earliest === -1 || idx < earliest)) earliest = idx;
            }
            if (earliest === -1) return snippet;
            const lead = 5;
            const start = Math.max(0, earliest - lead);
            let result = stripped.slice(start);
            if (start > 0 || hadLeadingEllipsis) result = '...' + result;
            return result;
        }

        function highlightSidebar(html, matchData) {
            const pat = matchData?.tokens
                ? matchData.tokens.map(escapeRegex).join('|')
                : searchTermToSnippetPattern(searchTerm);
            return html.replace(new RegExp(`(${pat})`, 'gis'), '<span class="highlight">$1</span>');
        }

        function tagTolerantPattern(escaped) {
            const t = '(?:<[^>]*>)*';
            return escaped.replace(/(\\ |\s+)/g, t + '$1' + t)
                .replace(/(?<=\S)(?=\\[^a-zA-Z\s])|(?<=\\[^a-zA-Z\s])(?=\S)/g, t);
        }

        function wrapTextSegments(match, cls, idx) {
            return match.split(/(<[^>]*>)/).map(seg =>
                seg.startsWith('<') ? seg
                : seg ? `<span class="${cls}" data-match-index="${idx}">${seg}</span>`
                : ''
            ).join('');
        }

        function highlightText(text, term) {
            if (!term) return text;
            if (Array.isArray(term)) return highlightTokens(text, term);
            const t = '(?:<[^>]*>)*';

            const hasNewlines = term.includes('\n') || /\\n/.test(term);
            if (!hasNewlines) {
                const pattern = tagTolerantPattern(entityAwareEscaped(escapeRegex(term)));
                const regex = new RegExp(`(${pattern})`, 'gi');
                return text.replace(regex, (match) => {
                    const cls = 'highlight';
                    const idx = globalMatchIndex;
                    globalMatchIndex++;
                    return wrapTextSegments(match, cls, idx);
                });
            }

            const htmlBroad = '(?:\\n|\\\\n|<br\\s*/?>\\s*|\\s+)';
            const htmlNarrow = '(?:\\n|<br\\s*/?>\\s*|\\s+)';
            const parts = [];
            let numGroups = 0;
            let i = 0;
            while (i < term.length) {
                if (i + 1 < term.length && term[i] === '\\' && term[i + 1] === 'n') {
                    parts.push(htmlBroad);
                    i += 2;
                } else if (term[i] === '\n') {
                    parts.push(htmlNarrow);
                    i += 1;
                } else {
                    let j = i + 1;
                    while (j < term.length) {
                        if (term[j] === '\n') break;
                        if (j + 1 < term.length && term[j] === '\\' && term[j + 1] === 'n') break;
                        j++;
                    }
                    parts.push('(' + tagTolerantPattern(entityAwareEscaped(escapeRegex(term.slice(i, j)))) + ')');
                    numGroups++;
                    i = j;
                }
            }

            const regex = new RegExp(parts.join(''), 'gis');
            return text.replace(regex, function() {
                const args = arguments;
                const cls = 'highlight';
                const idx = globalMatchIndex;
                globalMatchIndex++;
                const full = args[0];
                let result = '';
                let pos = 0;
                for (let g = 1; g <= numGroups; g++) {
                    const gt = args[g];
                    if (gt === undefined) continue;
                    const gp = full.indexOf(gt, pos);
                    result += full.slice(pos, gp);
                    result += wrapTextSegments(gt, cls, idx);
                    pos = gp + gt.length;
                }
                result += full.slice(pos);
                return result;
            });
        }

        function highlightTokens(text, tokens) {
            const alts = tokens.map(tok =>
                '\\b' + tagTolerantPattern(entityAwareEscaped(escapeRegex(tok))) + '\\b').join('|');
            const regex = new RegExp(`(${alts})`, 'gi');
            return text.replace(regex, (match) => {
                const cls = 'highlight';
                const idx = globalMatchIndex;
                globalMatchIndex++;
                return wrapTextSegments(match, cls, idx);
            });
        }

        function stringifyPayload(payload, pretty = false) {
            if (payload === null || payload === undefined) return '';
            if (typeof payload === 'string') return payload;
            try {
                return JSON.stringify(payload, null, pretty ? 2 : 0);
            } catch {
                return String(payload);
            }
        }

        function classifyMessage(msg) {
            return {
                isUser: msg.role === 'user',
                isDeveloper: msg.role === 'developer',
                isThinking: msg.kind === 'thinking',
                isCommentary: msg.kind === 'commentary',
                isToolResult: msg.kind === 'tool_result',
                isToolUse: msg.kind === 'tool_use',
                toolName: msg.name || 'Tool Use',
            };
        }

        function formatContent(msg, meta, highlightTerm) {
            if (meta.isToolResult) {
                const raw = msg.payload ?? '';
                const isObj = typeof raw !== 'string';
                const toolContent = isObj
                    ? highlightJson(JSON.stringify(raw, null, 2))
                    : escapeHtml(raw);
                const highlighted = highlightTerm ? highlightText(toolContent, highlightTerm) : toolContent;
                return `<div class="tool-use"><div class="tool-use-header"><span>Tool Result</span></div><div class="tool-use-content">${highlighted}</div></div>`;
            }

            if (meta.isToolUse) {
                const payloadText = stringifyPayload(msg.payload ?? {}, true);
                const tc = typeof msg.payload === 'string'
                    ? escapeHtml(payloadText)
                    : highlightJson(payloadText);
                const highlighted = highlightTerm ? highlightText(tc, highlightTerm) : tc;
                return `<div class="tool-use"><div class="tool-use-header"><span>${escapeHtml(msg.name || 'Tool Use')}</span></div><div class="tool-use-content">${highlighted}</div></div>`;
            }

            if (meta.isThinking) {
                const t = escapeHtml(msg.text || '');
                return `<div class="thinking-block"><div class="thinking-header">💭 Thinking</div><div class="thinking-content">${highlightTerm && includeThinking ? highlightText(t, highlightTerm) : t}</div><div class="thinking-expand" onclick="expandThinking(this.parentElement)">▼</div></div>`;
            }

            const text = msg.text || '';
            const processed = meta.isUser
                ? linkifyUrls(escapeHtml(text))
                : formatMarkdown(escapeHtml(text));
            return highlightTerm ? highlightText(processed, highlightTerm) : processed;
        }

        function renderMessage(msg, index, highlightTerm) {
            if (msg.hidden_by_default) return '';
            const meta = classifyMessage(msg);

            const isTool = meta.isToolResult || meta.isToolUse;
            const content = (isTool && filterToolsEnabled) ? '' : formatContent(msg, meta, highlightTerm);
            const timestamp = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : '';

            let avatar, avatarStyle, roleLabel, cssClass;
            if (meta.isToolResult) {
                avatar = '📤'; avatarStyle = 'background: transparent; font-size: 20px;';
                roleLabel = 'Tool Result'; cssClass = 'tool-result';
            } else if (meta.isToolUse) {
                avatar = '🔧'; avatarStyle = 'background: transparent; font-size: 20px;';
                roleLabel = meta.toolName; cssClass = 'assistant';
            } else if (meta.isUser) {
                avatar = 'U'; avatarStyle = '';
                roleLabel = 'User'; cssClass = 'user';
            } else if (meta.isDeveloper) {
                avatar = 'D'; avatarStyle = '';
                roleLabel = 'Developer'; cssClass = 'assistant';
            } else {
                avatar = msg.source === 'codex' ? 'O' : 'C'; avatarStyle = '';
                roleLabel = meta.isCommentary
                    ? `${getSourceLabel(msg.source)} Commentary`
                    : getSourceLabel(msg.source);
                cssClass = 'assistant';
            }

            const filterClass = isTool && filterToolsEnabled ? 'tool-filtered' : '';

            return `
        <div class="message ${cssClass} ${filterClass}" data-message-index="${index}" data-is-tool="${isTool}">
            <div class="message-avatar" ${avatarStyle ? `style="${avatarStyle}"` : ''}>${avatar}</div>
            <div class="message-content">
                <div class="message-header">
                    <div class="message-role">${roleLabel}</div>
                    <button class="copy-btn" onclick="copyMessage(this, ${index})">Copy</button>
                </div>
                <div class="message-text">${content}</div>
                ${timestamp ? `<div class="timestamp">${timestamp}</div>` : ''}
            </div>
        </div>
    `;
        }

        function closeOpenCodeFences(text) {
            let open = 0;
            const lines = text.split('\n');
            for (const line of lines) {
                if (/^(`{3,})/.test(line.trim())) open += 1;
            }
            return open % 2 !== 0 ? text + '\n```' : text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function entityAwareEscaped(escaped) {
            return escaped
                .replace(/&/g, '(?:&|&amp;)')
                .replace(/>/g, '(?:>|&gt;)')
                .replace(/</g, '(?:<|&lt;)')
                .replace(/"/g, '(?:"|&quot;)');
        }

        function highlightJson(jsonStr) {
            const s = '"(?:[^"\\\\]|\\\\.)*"';
            return jsonStr.replace(
                new RegExp(`(${s})(?=\\s*:)|:\\s*(${s})|:\\s*(-?\\d+\\.?\\d*(?:e[+-]?\\d+)?)|:\\s*\\b(true|false|null)\\b`, 'g'),
                (m, key, sv, num, kw) => {
                    if (key) return `<span class="json-key">${escapeHtml(key)}</span>`;
                    if (sv) {
                        const esc = escapeHtml(sv).replace(
                            /\\(\\)|\\([nrt])/g,
                            (m, bs, ctrl) => ctrl ? `<span class="json-escape">\\${ctrl}</span>` : m);
                        return `: <span class="json-string">${esc}</span>`;
                    }
                    if (num) return `: <span class="json-number">${num}</span>`;
                    if (kw) return `: <span class="json-${kw === 'null' ? 'null' : 'bool'}">${kw}</span>`;
                    return m;
                }
            );
        }

        function getTextContent(content) {
            if (typeof content === 'string') return content;
            if (!Array.isArray(content)) return '';
            return content
                .filter(item => item.type === 'text')
                .map(item => item.text || '')
                .join('');
        }

        function updateToggleUI(iconIds, textId, isActive, activeIcon, inactiveIcon) {
            (Array.isArray(iconIds) ? iconIds : [iconIds]).forEach(id => {
                document.getElementById(id).textContent = isActive ? activeIcon : inactiveIcon;
            });
            const prefix = document.getElementById(textId)?.querySelector('.show-hide-prefix');
            if (prefix) prefix.textContent = isActive ? 'Hide ' : 'Show ';
        }

        function linkifyUrls(html) {
            return html.replace(
                /(?:<a\s[^>]*>.*?<\/a>)|(?:<code[^>]*>[\s\S]*?<\/code>)|(?:<pre[^>]*>[\s\S]*?<\/pre>)|(https?:\/\/[^\s<>"\])]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:com|org|net|dev|io|co|edu|gov|app|build|page|site|world|info)\b(?:\/[^\s<>"\])]*)?)/gi,
                (match, url) => {
                    if (!url) return match;
                    const href = url.match(/^https?:\/\//i) ? url : `https://${url}`;
                    const clean = href.replace(/[.,;:!?)]+$/, '');
                    const trailing = href.slice(clean.length);
                    const displayClean = url.replace(/[.,;:!?)]+$/, '');
                    return `<a href="${clean}" target="_blank" rel="noopener">${displayClean}</a>${trailing}`;
                }
            );
        }

        const markedInstance = new marked.Marked({ breaks: true, gfm: true });
        markedInstance.use({ renderer: {
            code({ text, lang }) {
                const raw = text.replace(/&amp;/g, '&');
                let highlighted;
                if (lang && hljs.getLanguage(lang)) {
                    highlighted = hljs.highlight(raw, { language: lang }).value;
                } else {
                    highlighted = escapeHtml(raw);
                }
                const cls = lang ? ` class="hljs language-${escapeHtml(lang)}"` : ' class="hljs"';
                return `<pre><code${cls}>${highlighted}</code></pre>`;
            },
            codespan({ text }) {
                return `<code>${text.replace(/&amp;/g, '&')}</code>`;
            },
            heading({ tokens, depth }) {
                const text = this.parser.parseInline(tokens);
                return `<h${depth}>${text}</h${depth}>`;
            },
        }});

        function formatMarkdown(text) {
            let html = markedInstance.parse(text);
            html = html.replace(/<br>\s*<code>(─+)<\/code><\/li>\s*<\/(ul|ol)>/g,
                '</li></$2><p><code>$1</code></p>');
            html = linkifyUrls(html);
            return html;
        }

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function showConversationList() {

        function buildResumeCmd(source, convId, projectDir, isBackground) {
            let resumePart = source === 'codex'
                ? `codex resume ${convId}`
                : `claude --resume ${convId}`;
            if (source === 'claude' && isBackground) resumePart += ' --fork-session';
            if (projectDir) {
                const isWindows = /^[A-Z]:\\/.test(projectDir);
                if (isWindows) {
                    // Quote the whole line so cmd /c owns the &&, and use /d to
                    // switch drives; cmd's cd takes unquoted paths with spaces.
                    return `cmd /c "cd /d ${projectDir} && ${resumePart}"`;
                }
                const quote = projectDir.includes(' ') ? '"' : '';
                return `cd ${quote}${projectDir}${quote} && ${resumePart}`;
            }
            return resumePart;
        }

        function clearSearch() {
            document.getElementById('globalSearch').value = '';
            resizeSearchBox();
            document.getElementById('clearSearch').classList.remove('show');
            performSearch('');
        }
        
        function applySearchFilters() {
            const container = document.getElementById('conversationsList');

            const filteredMatches = {};

            for (const [convId, match] of Object.entries(rawSearchMatches)) {
                const visibleHits = (match.text_count || 0) +
                    (match.thinking_count || 0);

                if (match.is_internal && visibleHits === 0) {
                    continue;
                }

                const wordCount = (match.text_word_count || 0) +
                    (match.thinking_word_count || 0);
                const partialCount = visibleHits - wordCount;
                if (visibleHits > 0) {
                    const entry = {
                        count: visibleHits,
                        wordCount: wordCount,
                        sortWordCount: wordCount,
                        matchScore: wordCount > 0 ? wordCount * 10 + partialCount : partialCount,
                        snippet: match.snippet || '',
                        titleMatch: false,
                    };
                    if (match.tokens) entry.tokens = match.tokens;
                    filteredMatches[convId] = entry;
                }
            }

            // Also check title matches from loaded conversations
            const titleWordRe = new RegExp(`\\b${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
            allConversations.forEach(conv => {
                if (conv.title.toLowerCase().includes(searchTerm)) {
                    const isWholeWord = titleWordRe.test(conv.title);
                    if (!filteredMatches[conv.id]) {
                        filteredMatches[conv.id] = {
                            count: 0,
                            wordCount: 0,
                            sortWordCount: isWholeWord ? 1 : 0,
                            matchScore: isWholeWord ? 10 : 1,
                            snippet: '',
                            titleMatch: true,
                        };
                    } else {
                        filteredMatches[conv.id].sortWordCount += isWholeWord ? 1 : 0;
                        filteredMatches[conv.id].matchScore += isWholeWord ? 10 : 1;
                        filteredMatches[conv.id].titleMatch = true;
                    }
                }
            });

            // Filter conversations to those with matches, respecting agent toggle
            const filteredConversations = filterAgentThreads(allConversations).filter(conv => {
                const match = filteredMatches[conv.id];
                return match && (match.count > 0 || match.titleMatch);
            });

            // Phrase matches tier above all_terms, whole-word above partial, then score * recency
            const now = Date.now() / 1000;
            const halfLife = 3;
            filteredConversations.sort((a, b) => {
                const mA = filteredMatches[a.id], mB = filteredMatches[b.id];
                const isPhraseA = rawSearchMatches[a.id]?.match_type === 'all_terms' ? 0 : 1;
                const isPhraseB = rawSearchMatches[b.id]?.match_type === 'all_terms' ? 0 : 1;
                if (isPhraseA !== isPhraseB) return isPhraseB - isPhraseA;
                const hasWordA = mA.sortWordCount > 0 ? 1 : 0;
                const hasWordB = mB.sortWordCount > 0 ? 1 : 0;
                if (hasWordA !== hasWordB) return hasWordB - hasWordA;
                const recencyA = Math.pow(2, -((now - (a.modified || 0)) / 86400) / halfLife);
                const recencyB = Math.pow(2, -((now - (b.modified || 0)) / 86400) / halfLife);
                return mB.matchScore * recencyB - mA.matchScore * recencyA;
            });

            if (filteredConversations.length === 0 && Object.keys(rawSearchMatches).length > 0) {
                container.innerHTML = '<div class="empty-state"><p>No matches with current filters</p><p style="font-size: 12px; color: #666;">Try showing agent threads</p></div>';
            } else if (filteredConversations.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No matches found</p></div>';
            } else {
                renderConversations(filteredConversations, filteredMatches);
            }

            // Update message highlighting if a conversation is loaded
            if (currentConversation && allMessages.length > 0) {
                updateMessageSearchResults();
            }
        }

        async function performSearch(term) {
            searchTerm = term.toLowerCase();

            document.getElementById('clearSearch').classList.toggle('show', !!searchTerm);

            if (!searchTerm) {
                if (searchAbort) { searchAbort.abort(); searchAbort = null; }
                rawSearchMatches = {};
                currentMatchType = 'phrase';
                currentTokens = [];
                renderConversations(filterAgentThreads(allConversations));
                if (currentConversation) {
                    renderMessages(allMessages);
                } else {
                    document.getElementById('filterBtn').style.display = 'none';
                    document.getElementById('thinkingBtn').style.display = 'none';
                }
                document.getElementById('searchInfo').style.display = 'none';
                document.getElementById('matchNavBar').classList.remove('show');
                return;
            }

            if (searchAbort) searchAbort.abort();
            searchAbort = new AbortController();
            const signal = searchAbort.signal;
            const searchedTerm = searchTerm;
            const requestSeq = ++searchRequestSeq;

            const container = document.getElementById('conversationsList');
            container.innerHTML = '<div class="empty-state"><p>Searching...</p></div>';

            try {
                const response = await fetch(
                    `/api/search?q=${encodeURIComponent(term)}&include_thinking=${includeThinking}&client_id=${encodeURIComponent(searchClientId)}&request_seq=${requestSeq}`,
                    { signal });
                const data = await response.json();
                if (searchTerm !== searchedTerm || requestSeq !== searchRequestSeq) return;
                rawSearchMatches = data.matches || {};
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error('Error searching:', error);
                container.innerHTML = '<div class="empty-state"><p>Search failed</p></div>';
                return;
            }

            const loadedIds = new Set(allConversations.map(c => c.id));
            const hasMissing = Object.keys(rawSearchMatches).some(id => !loadedIds.has(id));
            if (hasMissing) {
                try {
                    const resp = await fetch('/api/conversations?include_internal=true', { signal });
                    if (resp.ok) allConversations = await resp.json();
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            document.getElementById('filterBtn').style.display = 'block';

            applySearchFilters();
        }

        function updateMessageSearchResults() {
            if (!currentConversation || allMessages.length === 0) return;

            const isTokenMode = currentMatchType === 'all_terms' && currentTokens.length > 1;
            const highlightArg = isTokenMode ? currentTokens : searchTerm;

            renderMessages(allMessages, highlightArg);

            const highlights = document.querySelectorAll('.message:not(.tool-filtered) .highlight[data-match-index]');
            const seen = new Set();
            searchResults = [];
            highlights.forEach(el => {
                const idx = el.getAttribute('data-match-index');
                if (!seen.has(idx)) {
                    seen.add(idx);
                    const msg = el.closest('.message');
                    const msgIndex = msg ? parseInt(msg.getAttribute('data-message-index'), 10) : 0;
                    searchResults.push({ messageIndex: msgIndex });
                }
            });

            if (pendingLastMatch && searchResults.length > 0) {
                pendingLastMatch = false;
                currentSearchIndex = searchResults.length - 1;
            } else {
                currentSearchIndex = 0;
            }

            if (searchResults.length > 0) {
                updateSearchInfo();
                scrollToCurrentMatch();
            } else {
                document.getElementById('searchInfo').style.display = 'none';
            }
        }

        function getConvList() {
            return Array.from(document.querySelectorAll('.conversation-item')).map(
                el => el.getAttribute('data-id'));
        }

        function navigateSearch(direction) {
            if (!searchTerm || searchResults.length === 0) return;

            if (direction === 'next' && currentSearchIndex < searchResults.length - 1) {
                currentSearchIndex++;
            } else if (direction === 'prev' && currentSearchIndex > 0) {
                currentSearchIndex--;
            } else {
                return;
            }

            updateSearchInfo();
            scrollToCurrentMatch(true);
        }

        function navigateConv(direction) {
            const convIds = getConvList();
            if (convIds.length === 0) return;

            if (!currentConversation || !convIds.includes(currentConversation)) {
                loadConversation(convIds[0], { scrollSidebar: true, smoothScroll: true });
                return;
            }

            const convIdx = convIds.indexOf(currentConversation);

            if (searchTerm && searchResults.length > 0) {
                if (direction === 'next') {
                    if (currentSearchIndex < searchResults.length - 1) {
                        currentSearchIndex++;
                        updateSearchInfo();
                        scrollToCurrentMatch(true);
                        return;
                    }
                    if (convIdx < convIds.length - 1) {
                        loadConversation(convIds[convIdx + 1], { scrollSidebar: true, smoothScroll: true });
                        return;
                    }
                } else {
                    if (currentSearchIndex > 0) {
                        currentSearchIndex--;
                        updateSearchInfo();
                        scrollToCurrentMatch(true);
                        return;
                    }
                    if (convIdx > 0) {
                        pendingLastMatch = true;
                        loadConversation(convIds[convIdx - 1], { scrollSidebar: true, smoothScroll: true });
                        return;
                    }
                    document.getElementById('globalSearch').focus();
                }
                return;
            }

            if (direction === 'next' && convIdx < convIds.length - 1) {
                loadConversation(convIds[convIdx + 1], { scrollSidebar: true, smoothScroll: true });
            } else if (direction === 'prev' && convIdx > 0) {
                loadConversation(convIds[convIdx - 1], { scrollSidebar: true, smoothScroll: true });
            } else if (direction === 'prev') {
                document.getElementById('globalSearch').focus();
            }
        }

        function updateSearchInfo() {
            const info = document.getElementById('searchInfo');
            const count = document.getElementById('searchCount');
            const navBar = document.getElementById('matchNavBar');

            if (searchResults.length > 0) {
                info.style.display = 'flex';
                const label = `${currentSearchIndex + 1}/${searchResults.length}`;
                count.textContent = label;

                const atFirst = currentSearchIndex === 0;
                const atLast = currentSearchIndex === searchResults.length - 1;

                document.getElementById('prevBtn').disabled = atFirst;
                document.getElementById('nextBtn').disabled = atLast;

                navBar.classList.add('show');
                document.getElementById('matchNavPrev').disabled = atFirst;
                document.getElementById('matchNavNext').disabled = atLast;
            } else {
                info.style.display = 'none';
                navBar.classList.remove('show');
            }
        }

        function applyCurrentHighlight() {
            document.querySelectorAll('.highlight.current').forEach(el => el.classList.remove('current'));
            const visible = document.querySelectorAll('.message:not(.tool-filtered) .highlight[data-match-index]');
            const seen = new Set();
            const ordered = [];
            for (const el of visible) {
                const idx = el.getAttribute('data-match-index');
                if (!seen.has(idx)) {
                    seen.add(idx);
                    ordered.push(idx);
                }
            }
            const targetIdx = ordered[currentSearchIndex];
            if (targetIdx !== undefined) {
                visible.forEach(el => {
                    if (el.getAttribute('data-match-index') === targetIdx) el.classList.add('current');
                });
            }
        }

        function scrollToCurrentMatch(smooth) {
            setTimeout(() => {
                applyCurrentHighlight();
                const el = document.querySelector('.message:not(.tool-filtered) .highlight.current');
                if (el) el.scrollIntoView({ behavior: smooth ? 'smooth' : 'instant', block: 'center' });
            }, 0);
        }

        function copyMessage(btn, messageIndex) {
            const msg = allMessages[messageIndex];
            let textToCopy = '';

            if (msg.kind === 'tool_use') {
                textToCopy = `Tool: ${msg.name || 'Tool Use'}\n${stringifyPayload(msg.payload, true)}`;
            } else if (msg.kind === 'tool_result') {
                textToCopy = stringifyPayload(msg.payload, true);
            } else {
                textToCopy = msg.text || '';
            }
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function exportConversation() {
            if (!currentConversation || !allMessages.length) return;

            let markdown = `# Conversation Export\n\n`;
            markdown += `**Date:** ${new Date().toLocaleString()}\n\n---\n\n`;

            allMessages.forEach(msg => {
                const meta = classifyMessage(msg);
                if (msg.hidden_by_default) return;
                if (filterToolsEnabled && (meta.isToolResult || meta.isToolUse)) return;
                if (meta.isThinking) return;

                let heading = '';
                let text = '';

                if (meta.isToolUse) {
                    heading = 'Tool Call';
                    text = `**Tool:** ${msg.name || 'Tool Use'}\n\`\`\`json\n${stringifyPayload(msg.payload, true)}\n\`\`\``;
                } else if (meta.isToolResult) {
                    heading = 'Tool Output';
                    const payloadText = stringifyPayload(msg.payload, true);
                    text = `\`\`\`\n${payloadText}\n\`\`\``;
                } else if (meta.isUser) {
                    heading = 'User';
                    text = closeOpenCodeFences((msg.text || '').trimEnd());
                } else if (meta.isDeveloper) {
                    heading = 'Developer';
                    text = (msg.text || '').trimEnd();
                } else {
                    heading = meta.isCommentary
                        ? `${getSourceLabel(msg.source)} Commentary`
                        : getSourceLabel(msg.source);
                    text = (msg.text || '').trimEnd();
                }

                if (!text) return;
                markdown += `## ${heading}\n\n${text}\n\n---\n\n`;
            });

            markdown = markdown.replace(/(\n---\n\n)+$/, '\n');

            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `conversation-${currentConversation}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleFilter() {
            filterToolsEnabled = !filterToolsEnabled;
            updateToggleUI(['filterIcon', 'filterIconMobile'], 'filterBtnText', !filterToolsEnabled, '❌', '🔧');

            document.querySelectorAll('[data-is-tool="true"]').forEach(elem => {
                elem.classList.toggle('tool-filtered', filterToolsEnabled);
            });

            if (searchTerm && searchResults.length > 0) {
                const highlights = document.querySelectorAll('.message:not(.tool-filtered) .highlight[data-match-index]');
                const seen = new Set();
                searchResults = [];
                highlights.forEach(el => {
                    const idx = el.getAttribute('data-match-index');
                    if (!seen.has(idx)) {
                        seen.add(idx);
                        const msg = el.closest('.message');
                        const msgIndex = msg ? parseInt(msg.getAttribute('data-message-index'), 10) : 0;
                        searchResults.push({ messageIndex: msgIndex });
                    }
                });
                currentSearchIndex = Math.min(currentSearchIndex, Math.max(0, searchResults.length - 1));
                if (searchResults.length > 0) {
                    updateSearchInfo();

        function expandThinking(block) {

        async function toggleThinking() {

        function toggleAgentThreads() {

            updateToggleUI('agentIcon', 'agentBtnText', showAgentThreads, '❌', '🕵🏻');

                renderConversations(filterAgentThreads(allConversations));
            }
