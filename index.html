        const searchController = createSearchInputController({
            delayMs: 400,
            onRun(value) {
                performSearch(value);
            },
        });

        // Search functionality with debounce
        const searchBox = document.getElementById('globalSearch');
        function resizeSearchBox() {
            searchBox.style.height = '40px';
            if (!searchBox.value) return;
            searchBox.style.height = Math.min(searchBox.scrollHeight, 120) + 'px';
        }
        resizeSearchBox();
        searchBox.addEventListener('input', (e) => {
            resizeSearchBox();
            searchController.schedule(e.target.value);
        });
        window.addEventListener('resize', resizeSearchBox);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const activeElement = document.activeElement;
            const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA';
            
            // Press '/' to focus search (on mobile, return to list view first)
            if (e.key === '/' && !isInputFocused) {
                e.preventDefault();
                if (isMobile()) showConversationList();
                document.getElementById('globalSearch').focus();
            }
            
            // Press 'Escape' to blur search and clear
            if (e.key === 'Escape') {
                document.activeElement.blur();
                if (searchTerm) {
                    document.getElementById('globalSearch').value = '';
                    resizeSearchBox();
                    searchController.cancel();
                    searchController.resetIssuedValue();
                    performSearch('');
                }
            }
            
            // Navigate search results with n/p
            if (!isInputFocused && searchResults.length > 0) {
                if (e.key === 'n') {
                    e.preventDefault();
                    navigateSearch('next');
                } else if (e.key === 'p') {
                    e.preventDefault();
                    navigateSearch('prev');
                }
            }
            
            if (!isInputFocused) {
                const convItems = document.querySelectorAll('.conversation-item');
                const dir = e.key === 'j' ? 1 : e.key === 'k' ? -1 : 0;
                if (dir && convItems.length > 0) {
                    e.preventDefault();
                    selectedConvIndex = Math.max(0, Math.min(selectedConvIndex + dir, convItems.length - 1));
                    convItems.forEach(item => item.style.outline = 'none');
                    convItems[selectedConvIndex].style.outline = '2px solid #4a9eff';
                    convItems[selectedConvIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else if (e.key === 'Enter' && convItems[selectedConvIndex]) {
                    e.preventDefault();
                    convItems[selectedConvIndex].click();
                }
            }
            
            // Show help with ?
            if (e.key === '?' && !isInputFocused) {
                e.preventDefault();
                const help = document.getElementById('shortcutsHelp');
                help.classList.toggle('show');
                setTimeout(() => help.classList.remove('show'), 5000);
            }
        });

        setInterval(async () => {
            if (searchTerm) return;
            const container = document.getElementById('conversationsList');
            const scrollTop = container.scrollTop;
            const activeId = currentConversation;
            const changed = await loadConversations();
            if (!changed) return;
            container.scrollTop = scrollTop;
            if (activeId) {
                document.querySelector(`[data-id="${activeId}"]`)?.classList.add('active');
            }
        }, 30000);

        // Browser back/forward navigation on mobile
        window.addEventListener('popstate', (e) => {
            if (!isMobile()) return;
            if (e.state?.conv) {
                loadConversation(e.state.conv);
            } else {
                showConversationList();
            }
        });

        // Sidebar resize
        (function() {
            const handle = document.getElementById('sidebarResize');
            const app = document.querySelector('.app');
            function setSidebarWidth(w) {
                app.style.setProperty('--sidebar-width', w + 'px');
                handle.style.left = w + 'px';
            }
            const saved = localStorage.getItem('sidebarWidth');
            if (saved) setSidebarWidth(parseInt(saved));

            let dragging = false;
            handle.addEventListener('mousedown', (e) => {
                dragging = true;
                handle.classList.add('dragging');
                document.body.classList.add('sidebar-dragging');
                e.preventDefault();
                e.stopPropagation();
            });
            handle.addEventListener('dragstart', (e) => e.preventDefault());
            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                e.preventDefault();
                setSidebarWidth(Math.max(200, Math.min(600, e.clientX)));
            });
            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove('dragging');
                document.body.classList.remove('sidebar-dragging');
                localStorage.setItem('sidebarWidth',
                    parseInt(getComputedStyle(app).getPropertyValue('--sidebar-width')));
            });
        })();

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            const active = document.activeElement;
            const inSearch = active === document.getElementById('globalSearch');
            if (inSearch && active.value) return;
            if (active && active.tagName === 'TEXTAREA' && !inSearch && active.value.includes('\n')) {
                const pos = active.selectionStart;
                const val = active.value;
                if (e.key === 'ArrowUp') {
                    const beforeCursor = val.slice(0, pos);
                    if (beforeCursor.includes('\n')) return;
                } else {
                    const afterCursor = val.slice(pos);
                    if (afterCursor.includes('\n')) return;
                }
            }
            e.preventDefault();
            navigateConv(e.key === 'ArrowDown' ? 'next' : 'prev');
        });

        requestAnimationFrame(() => {
            const search = document.getElementById('globalSearch');
            if (search) search.focus({ preventScroll: true });
        });

        const conversationsPane = document.getElementById('conversationsPane');
        const conversationsList = document.getElementById('conversationsList');
        if (conversationsPane && conversationsList) {
            conversationsPane.addEventListener('mouseenter', () => {
                conversationsPane.classList.add('show-scrollbar');
                updateSidebarScrollbar();
            });
            conversationsPane.addEventListener('mouseleave', () => {
                conversationsPane.classList.remove('show-scrollbar');
            });
            conversationsList.addEventListener('scroll', updateSidebarScrollbar, { passive: true });
            window.addEventListener('resize', updateSidebarScrollbar);
        }

        // Load conversations on page load
        loadConversations();
    </script>
</body>
</html>
