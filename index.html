<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccpeek - Claude Chat History Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0e0e0e;
            color: #e3e3e3;
            height: 100vh;
            overflow: hidden;
        }

        /* App grid — 2-column layout */
        .app {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }

        /* Row 1: top bar spans full width */
        .top-bar {
            grid-column: 1 / -1;
            min-height: 56px;
            background: #171717;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
        }

        .top-bar-logo {
            width: 280px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #2a2a2a;
            flex-shrink: 0;
        }

        .top-bar-controls {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            min-width: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            display: flex;
            align-items: baseline;
            flex-shrink: 0;
        }

        .logo-cc {
            font-weight: 900;
            color: #fff;
        }

        .logo-peek {
            font-weight: 700;
            color: #999;
        }

        /* Row 2 col 1: conversation list */
        .conversations-list {
            overflow-y: auto;
            padding: 8px;
            background: #171717;
            border-right: 1px solid #2a2a2a;
        }

        /* Row 2 col 2: main panel */
        .main-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conversation-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .conversation-item:hover {
            background: #1f1f1f;
        }

        .conversation-item.active {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }

        .conversation-item.matches-search {
            border-left: 3px solid #4a9eff;
        }

        .conversation-title {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .conversation-meta {
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-count {
            background: #4a9eff22;
            color: #4a9eff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .match-snippet {
            font-size: 12px;
            color: #888;
            margin: 4px 0;
        }

        .conv-header {
            height: 48px;
            padding: 0 12px;
            border-bottom: 1px solid #2a2a2a;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .resume-bar {
            padding: 8px 24px;
            border-bottom: 1px solid #2a2a2a;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .resume-bar.show {
            display: flex;
        }

        .resume-bar-label {
            color: #666;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .resume-bar-cmd {
            max-width: 100%;
            min-width: 0;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 6px 12px;
            color: #e3e3e3;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }

        .resume-bar-cmd:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }


        .resume-bar-copy {
            flex-shrink: 0;
            color: #666;
            font-size: 14px;
            display: flex;
            align-items: center;
            height: 14px;
        }

        .resume-bar-cmd:hover .resume-bar-copy {
            color: #999;
        }

        .resume-bar-cmd.copied {
            border-color: #4a9eff;
        }

        .resume-bar-cmd.copied .resume-bar-copy {
            color: #4a9eff;
        }

        .resume-bar-copy-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #4a9eff;
            white-space: nowrap;
        }

        .global-search {
            flex: 1;
            position: relative;
            min-width: 0;
            max-width: 600px;
        }

        .global-search textarea {
            width: 100%;
            padding: 10px 16px;
            padding-right: 140px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e3e3e3;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            overflow: hidden;
            min-height: 40px;
            line-height: 1.4;
            field-sizing: content;
            max-height: 120px;
            overflow-y: auto;
            display: block;
            margin: 5px 0;
        }

        .header-title {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: 600;
        }
        
        .search-controls {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clear-search {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.2s;
            display: none;
        }

        .clear-search:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .clear-search.show {
            display: block;
        }

        .global-search textarea:focus {
            outline: none;
            border-color: #4a4a4a;
            background: #0e0e0e;
        }

        .search-info {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
        }

        .search-nav {
            display: flex;
            gap: 4px;
        }

        .search-nav button {
            background: #2a2a2a;
            border: none;
            color: #999;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .search-nav button:hover:not(:disabled) {
            background: #3a3a3a;
            color: #fff;
        }

        .search-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .action-btn {
            background: none;
            border: 1px solid #2a2a2a;
            color: #999;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #2a2a2a;
            color: #fff;
            border-color: #3a3a3a;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px clamp(12px, 3vw, 24px);
            position: relative;
            font-size: 11pt;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            position: relative;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #4a5568;
        }

        .message.assistant .message-avatar {
            background: #d97706;
        }

        .message-content {
            flex: 1;
            min-width: 0;
            line-height: 1.6;
            position: relative;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .message-role {
            font-weight: 600;
            font-size: 14px;
        }

        .copy-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
            opacity: 0;
        }

        .message:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .copy-btn.copied {
            color: #4ade80;
        }

        .message-text {
            color: #d4d4d4;
            word-wrap: break-word;
        }

        .message.user .message-text {
            white-space: pre-wrap;
        }

        .message-text p {
            margin-bottom: 1em;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text h2 {
            font-size: 1.25em;
        }

        .message-text a {
            color: #c9a96e;
            text-decoration: underline;
        }

        .message-text ul,
        .message-text ol {
            padding-left: 1.5em;
            margin: 1em 0;
        }

        .message-text li {
            margin: 0;
        }

        .message-text ul li ~ li,
        .message-text ol li ~ li {
            margin: 0.5em 0;
        }

        h3 {
            margin: 0.5em 0;
        }

        hr {
            margin: 1em 0;
        }

        .message-text table {
            border-collapse: collapse;
            margin: 1.5em 0;
        }

        .message-text th,
        .message-text td {
            border: 1px solid #444;
            padding: 6px 10px;
        }

        .message-text th {
            background: #1a1a1a;
        }

        .message-text code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }

        .message-text pre {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
            position: relative;
        }

        .message-text pre code {
            background: none;
            padding: 0;
        }
        
        .thinking-block {
            background: #1a1f2e;
            border: 1px solid #2a3f5f;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            font-style: italic;
            color: #9ca3af;
            position: relative;
            white-space: pre-wrap;
        }
        
        .thinking-header {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
            font-weight: 600;
            font-style: normal;
        }

        .tool-use {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            margin: 8px 0;
            overflow: hidden;
        }

        .tool-use-header {
            font-size: 12px;
            color: #999;
            padding: 8px 12px;
            background: #0e0e0e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .tool-use-header:hover {
            background: #1a1a1a;
        }

        .tool-use-content {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #a8a8a8;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .tool-use.collapsed .tool-use-content {
            display: none;
        }

        .tool-use-toggle {
            font-size: 10px;
            color: #666;
        }

        .highlight {
            background: #fbbf24;
            color: #000;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 500;
        }

        .highlight.current {
            background: #fb923c;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: #999;
        }

        .timestamp {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .message.tool-filtered {
            display: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }

        /* Keyboard shortcuts help */
        .shortcuts-help {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            color: #666;
            display: none;
        }

        .shortcuts-help.show {
            display: block;
        }

        /* Back button (hidden on desktop) */
        .back-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #2a2a2a;
        }

        /* ── Narrow ── */
        @media (max-width: 800px) {
            .global-search textarea { padding-right: 40px; }
            .search-info { display: none !important; }
            .show-hide-prefix { display: none; }
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            /* Top bar stacks vertically */
            .top-bar {
                flex-wrap: wrap;
                height: auto;
            }

            .top-bar-logo {
                width: 100%;
                height: 48px;
                border-right: none;
                border-bottom: 1px solid #2a2a2a;
            }

            .top-bar-controls {
                padding: 8px 12px;
            }

            .global-search { max-width: none; }

            .global-search textarea { font-size: 16px; }

            /* Hide desktop-only buttons on mobile */
            #filterBtn, #exportBtn {
                display: none !important;
            }

            #internalBtn {
                font-size: 12px;
                padding: 6px 10px;
                white-space: nowrap;
            }

            /* List */
            .conversations-list { border-right: none; }

            /* Viewing a conversation: swap list for messages */
            .app.viewing-conv .conversations-list { display: none; }
            .app.viewing-conv .top-bar { display: none; }
            .app.viewing-conv .main-panel { display: flex; }
            .app.viewing-conv .conv-header { display: flex; }

            .back-btn { display: flex; }

            .resume-bar { display: none !important; }

            .main-panel { display: none; }

            .messages-container { padding: 16px 12px; }
            .message { gap: 10px; }
            .message-avatar { width: 28px; height: 28px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Row 1: top bar -->
        <div class="top-bar">
            <div class="top-bar-logo">
                <div class="logo">
                    <span class="logo-cc">cc</span><span class="logo-peek">peek</span>
                </div>
            </div>
            <div class="top-bar-controls">
                <div class="global-search">
                    <textarea id="globalSearch" rows="1" placeholder="Search everything... (Press '/' to focus)"></textarea>
                    <div class="search-controls">
                        <button class="clear-search" id="clearSearch" onclick="clearSearch()">✕</button>
                        <div class="search-info" id="searchInfo">
                            <span id="searchCount">0/0</span>
                            <div class="search-nav">
                                <button onclick="navigateSearch('prev')" id="prevBtn">↑</button>
                                <button onclick="navigateSearch('next')" id="nextBtn">↓</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="action-btn" onclick="toggleInternalThreads()" id="internalBtn">
                    <span id="internalIcon">👁</span> <span id="internalBtnText"><span class="show-hide-prefix">Show </span>Internal</span>
                </button>
                <button class="action-btn" onclick="toggleFilter()" id="filterBtn" style="display: none;">
                    <span id="filterIcon">🔽</span> <span id="filterBtnText"><span class="show-hide-prefix">Show </span>Tools</span>
                </button>
                <button class="action-btn" onclick="exportConversation()" id="exportBtn" style="display: none;">
                    <span>📥</span> Export
                </button>
            </div>
        </div>

        <!-- Row 2: list + conversation -->
        <div class="conversations-list" id="conversationsList">
            <div class="loading">Loading conversations...</div>
        </div>

        <div class="main-panel">
            <!-- Mobile-only header: back button + title + show tools -->
            <div class="conv-header" id="convHeader">
                <button class="back-btn" onclick="history.back()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <span class="header-title truncate" id="headerTitle"></span>
                <button class="action-btn" onclick="toggleFilter()" id="filterBtnMobile" style="display: none;">
                    <span id="filterIconMobile">🔽</span> Tools
                </button>
            </div>
            <div class="resume-bar" id="resumeBar">
                <span class="resume-bar-label" id="resumeBarLabel">To resume:</span>
                <div class="resume-bar-cmd" id="resumeCmd" onclick="copyResumeCommand()">
                    <span class="resume-bar-cmd-text truncate" id="resumeCmdText"></span>
                    <span class="resume-bar-copy" id="resumeCopyIcon">✂</span>
                    <span class="resume-bar-copy-label" id="resumeCopyLabel"></span>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <h2>Select a conversation</h2>
                    <p>Choose a conversation from the sidebar to view its messages</p>
                </div>
            </div>
        </div>
    </div>


    <div class="shortcuts-help" id="shortcutsHelp">
        <strong>Keyboard Shortcuts:</strong><br>
        / - Search (Shift+Enter for newline)<br>
        Esc - Clear search<br>
        j/k - Navigate chats<br>
        Enter - Open chat<br>
        n/p - Next/prev result<br>
        ? - Toggle help
    </div>

    <script>
        let allConversations = [];
        let currentConversation = null;
        let allMessages = [];
        let searchResults = [];
        let currentSearchIndex = 0;
        let searchTerm = '';
        let selectedConvIndex = 0;
        let filterToolsEnabled = true; // Start with tools hidden
        let showInternalThreads = false; // Hide internal/subagent threads by default
        let searchDebounceTimer = null;
        let rawSearchMatches = {}; // Store unfiltered search results for client-side filtering

        // Load conversations on startup
        async function loadConversations() {
            try {
                const response = await fetch(`/api/conversations?include_internal=${showInternalThreads}`);
                allConversations = await response.json();
                renderConversations(allConversations);
            } catch (error) {
                console.error('Error loading conversations:', error);
                document.getElementById('conversationsList').innerHTML =
                    '<div class="empty-state"><p>Error loading conversations</p></div>';
            }
        }

        function renderConversations(conversations, searchMatches = {}) {
            selectedConvIndex = 0;
            const container = document.getElementById('conversationsList');

            if (conversations.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No conversations found</p></div>';
                return;
            }

            container.innerHTML = conversations.map(conv => {
                const date = new Date(conv.timestamp || conv.modified * 1000);
                const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                const matchData = searchMatches[conv.id];
                const hasMatches = matchData && (typeof matchData === 'object' ? matchData.count > 0 : matchData > 0);
                const matchCount = matchData ? (typeof matchData === 'object' ? matchData.count : matchData) : 0;
                const snippet = matchData && typeof matchData === 'object' ? matchData.snippet : '';

                return `
                    <div class="conversation-item ${hasMatches ? 'matches-search' : ''} ${conv.id === currentConversation ? 'active' : ''}"
                         data-id="${conv.id}"
                         onclick="loadConversation('${conv.id}')">
                        <div class="conversation-title truncate">${escapeHtml(conv.title)}</div>
                        ${hasMatches && snippet ? `<div class="match-snippet truncate">${searchTerm ? escapeHtml(snippet).replace(new RegExp(`(${searchTermToSnippetPattern(searchTerm)})`, 'gis'), '<span class="highlight">$1</span>') : escapeHtml(snippet)}</div>` : ''}
                        <div class="conversation-meta">
                            <span>${dateStr}</span>
                            ${hasMatches ? `<span class="match-count">${matchCount} matches</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadConversation(conversationId) {
            // Update active state
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-id="${conversationId}"]`)?.classList.add('active');

            currentConversation = conversationId;

            const conv = allConversations.find(c => c.id === conversationId);
            document.getElementById('headerTitle').textContent = conv ? conv.title : '';

            if (isMobile()) {
                document.getElementById('app').classList.add('viewing-conv');
                if (history.state?.conv !== conversationId) {
                    history.pushState({ conv: conversationId }, '');
                }
            }
            document.getElementById('exportBtn').style.display = 'block';
            document.getElementById('filterBtn').style.display = 'block';
            document.getElementById('filterBtnMobile').style.display = 'block';

            // Show loading
            document.getElementById('messagesContainer').innerHTML = '<div class="loading">Loading messages...</div>';

            try {
                const includeInternal = showInternalThreads || !!rawSearchMatches[conversationId];
                const response = await fetch(`/api/conversation/${conversationId}?include_internal=${includeInternal}`);
                const data = await response.json();

                // Check for error response from server
                if (data.error) {
                    let errorMsg = data.error;
                    if (data.conversation_id) {
                        errorMsg += ` (${data.conversation_id})`;
                    }
                    document.getElementById('messagesContainer').innerHTML =
                        `<div class="empty-state"><p>${escapeHtml(errorMsg)}</p></div>`;
                    return;
                }

                allMessages = data;
                renderMessages(allMessages);
                updateResumeBar();

                // Re-apply search highlighting in messages if there's an active search
                if (searchTerm) {
                    updateMessageSearchResults();
                }
            } catch (error) {
                console.error('Error loading conversation:', error);
                document.getElementById('messagesContainer').innerHTML =
                    `<div class="empty-state"><p>Error loading conversation: ${escapeHtml(conversationId)}</p><p style="font-size: 12px; color: #666; margin-top: 8px;">${escapeHtml(error.message || 'Network error')}</p></div>`;
            }
        }

        function renderMessages(messages, highlightTerm = '') {
            const container = document.getElementById('messagesContainer');

            const messageHtml = messages.map((msg, index) => {
                return renderMessage(msg, index, highlightTerm);
            }).filter(html => html).join('');

            container.innerHTML = messageHtml || '<div class="empty-state"><p>No messages in this conversation</p></div>';
            
            // Add tool use toggle functionality
            document.querySelectorAll('.tool-use-header').forEach(header => {
                header.addEventListener('click', () => {
                    header.parentElement.classList.toggle('collapsed');
                    const toggle = header.querySelector('.tool-use-toggle');
                    toggle.textContent = header.parentElement.classList.contains('collapsed') ? '▶' : '▼';
                });
            });
        }

        function searchTermToPattern(term, forHtml) {
            const broad = forHtml
                ? '(?:\\n|\\\\n|<br\\s*/?>\\s*|\\s+)'
                : '(?:\\n|\\\\n|\\s+)';
            const narrow = forHtml
                ? '(?:\\n|<br\\s*/?>\\s*|\\s+)'
                : '(?:\\n|\\s+)';
            const result = [];
            let i = 0;
            while (i < term.length) {
                if (i + 1 < term.length && term[i] === '\\' && term[i + 1] === 'n') {
                    result.push(broad);
                    i += 2;
                } else if (term[i] === '\n') {
                    result.push(narrow);
                    i += 1;
                } else {
                    let j = i + 1;
                    while (j < term.length) {
                        if (term[j] === '\n') break;
                        if (j + 1 < term.length && term[j] === '\\' && term[j + 1] === 'n') break;
                        j++;
                    }
                    result.push(escapeRegex(term.slice(i, j)));
                    i = j;
                }
            }
            return result.join('');
        }

        function searchTermToSnippetPattern(term) {
            const result = [];
            let i = 0;
            while (i < term.length) {
                if (i + 1 < term.length && term[i] === '\\' && term[i + 1] === 'n') {
                    i += 2;
                } else if (term[i] === '\n') {
                    i += 1;
                } else {
                    let j = i + 1;
                    while (j < term.length) {
                        if (term[j] === '\n') break;
                        if (j + 1 < term.length && term[j] === '\\' && term[j + 1] === 'n') break;
                        j++;
                    }
                    result.push(escapeRegex(term.slice(i, j)));
                    i = j;
                }
            }
            return result.join('|');
        }

        function highlightText(text, term) {
            if (!term) return text;

            const hasNewlines = term.includes('\n') || /\\n/.test(term);
            if (!hasNewlines) {
                const regex = new RegExp(`(${escapeRegex(term)})`, 'gi');
                let matchIndex = 0;
                return text.replace(regex, (match) => {
                    const isCurrent = matchIndex === currentSearchIndex;
                    matchIndex++;
                    return `<span class="highlight ${isCurrent ? 'current' : ''}" data-match-index="${matchIndex - 1}">${match}</span>`;
                });
            }

            const htmlBroad = '(?:\\n|\\\\n|<br\\s*/?>\\s*|\\s+)';
            const htmlNarrow = '(?:\\n|<br\\s*/?>\\s*|\\s+)';
            const parts = [];
            let numGroups = 0;
            let i = 0;
            while (i < term.length) {
                if (i + 1 < term.length && term[i] === '\\' && term[i + 1] === 'n') {
                    parts.push(htmlBroad);
                    i += 2;
                } else if (term[i] === '\n') {
                    parts.push(htmlNarrow);
                    i += 1;
                } else {
                    let j = i + 1;
                    while (j < term.length) {
                        if (term[j] === '\n') break;
                        if (j + 1 < term.length && term[j] === '\\' && term[j + 1] === 'n') break;
                        j++;
                    }
                    parts.push('(' + escapeRegex(term.slice(i, j)) + ')');
                    numGroups++;
                    i = j;
                }
            }

            const regex = new RegExp(parts.join(''), 'gis');
            let matchIndex = 0;
            return text.replace(regex, function() {
                const args = arguments;
                const isCurrent = matchIndex === currentSearchIndex;
                const cls = `highlight ${isCurrent ? 'current' : ''}`;
                const idx = matchIndex;
                matchIndex++;
                const full = args[0];
                let result = '';
                let pos = 0;
                for (let g = 1; g <= numGroups; g++) {
                    const gt = args[g];
                    if (gt === undefined) continue;
                    const gp = full.indexOf(gt, pos);
                    result += full.slice(pos, gp);
                    result += `<span class="${cls}" data-match-index="${idx}">${gt}</span>`;
                    pos = gp + gt.length;
                }
                result += full.slice(pos);
                return result;
            });
        }

        function classifyMessage(msg) {
            const message = msg.message;
            const content = message?.content;
            const isUser = msg.type === 'user';

            let isToolResult = false;
            let isToolUse = false;
            let toolName = '';
            let isLocalCommand = false;

            if (isUser && typeof content === 'string') {
                isLocalCommand = content.includes('<command-name>') ||
                    content.includes('<local-command-stdout>') ||
                    content.includes('Caveat: The messages below were generated by the user while running local commands');
            }
            if (Array.isArray(content)) {
                isToolResult = isUser && content.some(item => item.type === 'tool_result');
                const toolUseItem = !isUser && content.find(item => item.type === 'tool_use');
                if (toolUseItem) {
                    isToolUse = true;
                    toolName = toolUseItem.name || 'Tool Use';
                }
            }

            return { isUser, isToolResult, isToolUse, toolName, isLocalCommand };
        }

        function formatContent(msg, meta, highlightTerm) {
            const content = msg.message?.content;
            if (!content) return '';

            if (meta.isToolResult && Array.isArray(content)) {
                return content.map(item => {
                    if (item.type !== 'tool_result') return '';
                    const toolContent = escapeHtml(item.content || '');
                    const highlighted = highlightTerm ? highlightText(toolContent, highlightTerm) : toolContent;
                    return `<div class="tool-use"><div class="tool-use-header"><span>Tool Result${item.tool_use_id ? ` (${item.tool_use_id.slice(-8)})` : ''}</span><span class="tool-use-toggle">▼</span></div><div class="tool-use-content">${highlighted}</div></div>`;
                }).join('');
            }

            if (typeof content === 'string') {
                const processed = meta.isUser
                    ? linkifyUrls(escapeHtml(content))
                    : formatMarkdown(escapeHtml(content));
                return highlightTerm ? highlightText(processed, highlightTerm) : processed;
            }

            if (Array.isArray(content)) {
                return content.map(item => {
                    if (item.type === 'text') {
                        const text = meta.isUser
                            ? linkifyUrls(escapeHtml(item.text || ''))
                            : formatMarkdown(escapeHtml(item.text || ''));
                        return highlightTerm ? highlightText(text, highlightTerm) : text;
                    }
                    if (item.type === 'thinking') {
                        const t = escapeHtml(item.thinking || '');
                        return `<div class="thinking-block"><div class="thinking-header">💭 Thinking</div><div>${highlightTerm ? highlightText(t, highlightTerm) : t}</div></div>`;
                    }
                    if (item.type === 'tool_use') {
                        const tc = escapeHtml(JSON.stringify(item.input, null, 2));
                        return `<div class="tool-use collapsed"><div class="tool-use-header"><span>${escapeHtml(item.name || 'Tool Use')}</span><span class="tool-use-toggle">▶</span></div><div class="tool-use-content">${highlightTerm ? highlightText(tc, highlightTerm) : tc}</div></div>`;
                    }
                    return '';
                }).join('');
            }
            return '';
        }

        function renderMessage(msg, index, highlightTerm) {
            if (!msg.message) return '';
            const meta = classifyMessage(msg);
            if (meta.isLocalCommand) return '';

            const content = formatContent(msg, meta, highlightTerm);
            const isTool = meta.isToolResult || meta.isToolUse;
            const timestamp = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : '';

            let avatar, avatarStyle, roleLabel, cssClass;
            if (meta.isToolResult) {
                avatar = '📤'; avatarStyle = 'background: transparent; font-size: 20px;';
                roleLabel = 'Tool Result'; cssClass = 'tool-result';
            } else if (meta.isToolUse) {
                avatar = '🔧'; avatarStyle = 'background: transparent; font-size: 20px;';
                roleLabel = meta.toolName; cssClass = 'assistant';
            } else if (meta.isUser) {
                avatar = 'U'; avatarStyle = '';
                roleLabel = 'User'; cssClass = 'user';
            } else {
                avatar = 'C'; avatarStyle = '';
                roleLabel = 'Claude'; cssClass = 'assistant';
            }

            const filterClass = isTool && filterToolsEnabled ? 'tool-filtered' : '';

            return `
        <div class="message ${cssClass} ${filterClass}" data-message-index="${index}" data-is-tool="${isTool}">
            <div class="message-avatar" ${avatarStyle ? `style="${avatarStyle}"` : ''}>${avatar}</div>
            <div class="message-content">
                <div class="message-header">
                    <div class="message-role">${roleLabel}</div>
                    <button class="copy-btn" onclick="copyMessage(this, ${index})">Copy</button>
                </div>
                <div class="message-text">${content}</div>
                ${timestamp ? `<div class="timestamp">${timestamp}</div>` : ''}
            </div>
        </div>
    `;
        }

        function closeOpenCodeFences(text) {
            let open = 0;
            const lines = text.split('\n');
            for (const line of lines) {
                if (/^(`{3,})/.test(line.trim())) open += 1;
            }
            return open % 2 !== 0 ? text + '\n```' : text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function getTextContent(content) {
            if (typeof content === 'string') return content;
            if (!Array.isArray(content)) return '';
            return content
                .filter(item => item.type === 'text')
                .map(item => item.text || '')
                .join('');
        }

        function updateToggleUI(iconIds, textId, isActive, activeIcon, inactiveIcon) {
            (Array.isArray(iconIds) ? iconIds : [iconIds]).forEach(id => {
                document.getElementById(id).textContent = isActive ? activeIcon : inactiveIcon;
            });
            const prefix = document.getElementById(textId)?.querySelector('.show-hide-prefix');
            if (prefix) prefix.textContent = isActive ? 'Hide ' : 'Show ';
        }

        function linkifyUrls(html) {
            return html.replace(
                /(?:<a\s[^>]*>.*?<\/a>)|(?:<code[^>]*>[\s\S]*?<\/code>)|(?:<pre[^>]*>[\s\S]*?<\/pre>)|((?:https?:\/\/|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:com|org|net|dev|io|co|edu|gov|app|build|page|site|world|info)\b)(?:\/[^\s<>"\])]*)?)/gi,
                (match, url) => {
                    if (!url) return match;
                    const href = url.match(/^https?:\/\//i) ? url : `https://${url}`;
                    const clean = href.replace(/[.,;:!?)]+$/, '');
                    const trailing = href.slice(clean.length);
                    const displayClean = url.replace(/[.,;:!?)]+$/, '');
                    return `<a href="${clean}" target="_blank" rel="noopener">${displayClean}</a>${trailing}`;
                }
            );
        }

        const markedInstance = new marked.Marked({ breaks: true, gfm: true });
        markedInstance.use({ renderer: {
            code({ text }) {
                return `<pre><code>${text.replace(/&amp;/g, '&')}</code></pre>`;
            },
            codespan({ text }) {
                return `<code>${text.replace(/&amp;/g, '&')}</code>`;
            },
            heading({ tokens, depth }) {
                const text = this.parser.parseInline(tokens);
                return `<h${depth}>${text}</h${depth}>`;
            },
        }});

        function formatMarkdown(text) {
            let html = markedInstance.parse(text);
            html = html.replace(/<br>\s*<code>(─+)<\/code><\/li>\s*<\/(ul|ol)>/g,
                '</li></$2><p><code>$1</code></p>');
            html = linkifyUrls(html);
            return html;
        }

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function showConversationList() {
            document.getElementById('app').classList.remove('viewing-conv');
        }

        function buildResumeCmd(convId, projectDir, isBackground) {
            let resumePart = `claude --resume ${convId}`;
            if (isBackground) resumePart += ' --fork-session';
            if (projectDir) {
                const isWindows = /^[A-Z]:\\/.test(projectDir);
                const quote = projectDir.includes(' ') ? '"' : '';
                const cdPart = `cd ${quote}${projectDir}${quote}`;
                return isWindows
                    ? `cmd /c ${cdPart} && ${resumePart}`
                    : `${cdPart} && ${resumePart}`;
            }
            return resumePart;
        }

        function updateResumeBar() {
            const bar = document.getElementById('resumeBar');
            const label = document.getElementById('resumeBarLabel');
            if (!currentConversation) {
                bar.classList.remove('show');
                return;
            }
            const conv = allConversations.find(c => c.id === currentConversation);
            if (!conv) {
                bar.classList.remove('show');
                return;
            }

            let resumeId, projectDir, isBackground;
            if (conv.parent_id) {
                label.textContent = 'Resume parent:';
                resumeId = conv.parent_id;
                projectDir = conv.project_dir;
                const parentConv = allConversations.find(c => c.id === conv.parent_id);
                isBackground = parentConv?.is_background;
            } else {
                label.textContent = 'To resume:';
                resumeId = currentConversation;
                projectDir = conv.project_dir;
                isBackground = conv.is_background;
            }

            document.getElementById('resumeCmdText').textContent = buildResumeCmd(resumeId, projectDir, isBackground);
            bar.classList.add('show');
        }

        function copyResumeCommand() {
            const text = document.getElementById('resumeCmdText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const cmd = document.getElementById('resumeCmd');
                const icon = document.getElementById('resumeCopyIcon');
                const label = document.getElementById('resumeCopyLabel');
                cmd.classList.add('copied');
                icon.style.display = 'none';
                label.textContent = 'Copied!';
                setTimeout(() => {
                    cmd.classList.remove('copied');
                    icon.style.display = '';
                    label.textContent = '';
                }, 2000);
            });
        }

        function clearSearch() {
            document.getElementById('globalSearch').value = '';
            document.getElementById('clearSearch').classList.remove('show');
            performSearch('');
        }
        
        function applySearchFilters() {
            // Filter search results based on internal thread toggle only
            // (Hide Tools only affects message display, not which conversations appear)
            const container = document.getElementById('conversationsList');

            const filteredMatches = {};

            for (const [convId, match] of Object.entries(rawSearchMatches)) {
                const thinkingHits = match.thinking_count || 0;
                const visibleHits = (match.text_count || 0) + thinkingHits;

                // Skip internal threads unless they have user-visible matches
                // (text or thinking), since thinking is always shown to the user
                if (match.is_internal && !showInternalThreads && visibleHits === 0) {
                    continue;
                }

                const totalCount = visibleHits + (match.tool_count || 0);
                if (totalCount > 0) {
                    filteredMatches[convId] = {
                        count: totalCount,
                        snippet: match.snippet || ''
                    };
                }
            }

            // Also check title matches from loaded conversations
            allConversations.forEach(conv => {
                if (conv.title.toLowerCase().includes(searchTerm)) {
                    if (!filteredMatches[conv.id]) {
                        filteredMatches[conv.id] = { count: 1, snippet: '' };
                    } else {
                        filteredMatches[conv.id].count += 1;
                    }
                }
            });

            // Filter conversations to those with matches
            const filteredConversations = allConversations.filter(conv => {
                const match = filteredMatches[conv.id];
                return match && match.count > 0;
            });

            if (filteredConversations.length === 0 && Object.keys(rawSearchMatches).length > 0) {
                // Has matches but in internal threads that are hidden
                container.innerHTML = '<div class="empty-state"><p>No matches with current filters</p><p style="font-size: 12px; color: #666;">Try showing internal threads</p></div>';
            } else if (filteredConversations.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No matches found</p></div>';
            } else {
                renderConversations(filteredConversations, filteredMatches);
            }

            // Update message highlighting if a conversation is loaded
            if (currentConversation && allMessages.length > 0) {
                updateMessageSearchResults();
            }
        }

        async function performSearch(term) {
            searchTerm = term.toLowerCase();

            document.getElementById('clearSearch').classList.toggle('show', !!searchTerm);

            if (!searchTerm) {
                rawSearchMatches = {};
                renderConversations(allConversations);
                if (currentConversation) {
                    renderMessages(allMessages);
                }
                document.getElementById('searchInfo').style.display = 'none';
                return;
            }

            // Show loading state
            const container = document.getElementById('conversationsList');
            container.innerHTML = '<div class="empty-state"><p>Searching...</p></div>';

            // Search across all conversations via server-side API (always includes internal)
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(term)}`);
                const data = await response.json();
                rawSearchMatches = data.matches || {};
            } catch (error) {
                console.error('Error searching:', error);
                container.innerHTML = '<div class="empty-state"><p>Search failed</p></div>';
                return;
            }

            // If search found conversations not in allConversations (e.g. internal
            // threads with thinking matches), re-fetch the full list so they can render
            const loadedIds = new Set(allConversations.map(c => c.id));
            const hasMissing = Object.keys(rawSearchMatches).some(id => !loadedIds.has(id));
            if (hasMissing) {
                try {
                    const resp = await fetch('/api/conversations?include_internal=true');
                    if (resp.ok) allConversations = await resp.json();
                } catch (e) { /* keep existing list */ }
            }

            // Apply filters and render
            applySearchFilters();
        }

        function updateMessageSearchResults() {
            // Update search results for currently loaded messages
            // Only search visible content (exclude tool content when tools are hidden)
            if (!currentConversation || allMessages.length === 0) return;

            searchResults = [];
            const includeTools = !filterToolsEnabled;

            const regex = new RegExp(searchTermToPattern(searchTerm), 'gis');

            allMessages.forEach((msg, msgIndex) => {
                const msgContent = msg.message?.content;
                if (!msgContent) return;

                let content = '';
                if (typeof msgContent === 'string') {
                    content = msgContent;
                } else if (Array.isArray(msgContent)) {
                    content = msgContent.reduce((acc, item) => {
                        if (item.type === 'text') return acc + ' ' + (item.text || '');
                        if (item.type === 'thinking') return acc + ' ' + (item.thinking || '');
                        if (includeTools && item.type === 'tool_result') return acc + ' ' + (item.content || '');
                        if (includeTools && item.type === 'tool_use') return acc + ' ' + JSON.stringify(item.input || {});
                        return acc;
                    }, '');
                }

                const matches = content.match(regex);
                if (matches) {
                    for (let i = 0; i < matches.length; i++) searchResults.push({ messageIndex: msgIndex });
                }
            });

            if (searchResults.length > 0) {
                currentSearchIndex = 0;
                updateSearchInfo();
                renderMessages(allMessages, searchTerm);
                scrollToCurrentMatch();
            } else {
                renderMessages(allMessages, searchTerm);
                document.getElementById('searchInfo').style.display = 'none';
            }
        }

        function navigateSearch(direction) {
            if (searchResults.length === 0) return;
            
            if (direction === 'next') {
                currentSearchIndex = (currentSearchIndex + 1) % searchResults.length;
            } else {
                currentSearchIndex = (currentSearchIndex - 1 + searchResults.length) % searchResults.length;
            }
            
            updateSearchInfo();
            renderMessages(allMessages, searchTerm);
            scrollToCurrentMatch();
        }

        function updateSearchInfo() {
            const info = document.getElementById('searchInfo');
            const count = document.getElementById('searchCount');

            if (searchResults.length > 0) {
                info.style.display = 'flex';
                count.textContent = `${currentSearchIndex + 1}/${searchResults.length}`;

                document.getElementById('prevBtn').disabled = searchResults.length <= 1;
                document.getElementById('nextBtn').disabled = searchResults.length <= 1;
            } else {
                info.style.display = 'none';
            }
        }

        function scrollToCurrentMatch() {
            // Use double requestAnimationFrame to ensure DOM has fully updated and layout is complete
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // Only select visible highlights (exclude those in tool-filtered messages)
                    const highlights = document.querySelectorAll('.message:not(.tool-filtered) .highlight');
                    if (highlights[currentSearchIndex]) {
                        highlights[currentSearchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });
        }

        function copyMessage(btn, messageIndex) {
            const msg = allMessages[messageIndex];
            let textToCopy = '';

            if (msg.message && msg.message.content) {
                if (typeof msg.message.content === 'string') {
                    textToCopy = msg.message.content;
                } else if (Array.isArray(msg.message.content)) {
                    textToCopy = msg.message.content.map(item => {
                        if (item.type === 'text') return item.text || '';
                        if (item.type === 'tool_use') return `Tool: ${item.name}\n${JSON.stringify(item.input, null, 2)}`;
                        if (item.type === 'tool_result') return `Tool Result: ${item.content}`;
                        return '';
                    }).join('\n');
                }
            }
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function exportConversation() {
            if (!currentConversation || !allMessages.length) return;

            let markdown = `# Conversation Export\n\n`;
            markdown += `**Date:** ${new Date().toLocaleString()}\n\n---\n\n`;

            allMessages.forEach(msg => {
                const meta = classifyMessage(msg);
                if (meta.isLocalCommand) return;
                if (filterToolsEnabled && meta.isToolResult) return;

                const content = msg.message?.content;
                let text = '';

                if (typeof content === 'string') {
                    text = content;
                } else if (Array.isArray(content)) {
                    content.forEach(item => {
                        if (item.type === 'text') text += item.text + '\n\n';
                        if (!filterToolsEnabled && item.type === 'tool_use') {
                            text += `**Tool:** ${item.name}\n\`\`\`json\n${JSON.stringify(item.input, null, 2)}\n\`\`\`\n\n`;
                        }
                    });
                }

                text = meta.isUser ? closeOpenCodeFences(text.trimEnd()) : text.trimEnd();
                if (!text) return;

                const role = meta.isUser ? 'User' : 'Claude';
                markdown += `## ${role}\n\n${text}\n\n---\n\n`;
            });

            markdown = markdown.replace(/(\n---\n\n)+$/, '\n');

            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `conversation-${currentConversation}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleFilter() {
            filterToolsEnabled = !filterToolsEnabled;
            updateToggleUI(['filterIcon', 'filterIconMobile'], 'filterBtnText', !filterToolsEnabled, '🔼', '🔽');

            document.querySelectorAll('[data-is-tool="true"]').forEach(elem => {
                elem.classList.toggle('tool-filtered', filterToolsEnabled);
            });

            // Update message highlighting if search is active
            if (searchTerm && currentConversation && allMessages.length > 0) {
                updateMessageSearchResults();
            }
        }

        async function toggleInternalThreads() {
            const newState = !showInternalThreads;
            const btn = document.getElementById('internalBtn');
            btn.disabled = true; // Prevent double-clicks during fetch

            // Optimistically update UI
            showInternalThreads = newState;
            updateToggleUI('internalIcon', 'internalBtnText', newState, '✕', '👁');

            try {
                const response = await fetch(`/api/conversations?include_internal=${newState}`);
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();

                // Only apply if state still matches (not stale response from rapid toggling)
                if (showInternalThreads === newState) {
                    allConversations = data;

                    // Clear current conversation if it's no longer in the list
                    if (currentConversation) {
                        const stillExists = allConversations.some(c => c.id === currentConversation);
                        if (!stillExists) {
                            currentConversation = null;
                            allMessages = [];
                            searchResults = [];
                            document.getElementById('messagesContainer').innerHTML =
                                '<div class="empty-state"><h2>Select a conversation</h2><p>Choose a conversation from the sidebar to view its messages</p></div>';
                            document.getElementById('filterBtn').style.display = 'none';
                            document.getElementById('exportBtn').style.display = 'none';
                            document.getElementById('resumeBar').classList.remove('show');
                        }
                    }

                    // Re-filter search or render conversations
                    if (searchTerm) {
                        applySearchFilters();
                    } else {
                        renderConversations(allConversations);
                    }
                }
            } catch (error) {
                console.error('Error toggling internal threads:', error);
                // Revert state on error
                showInternalThreads = !newState;
                updateToggleUI('internalIcon', 'internalBtnText', showInternalThreads, '✕', '👁');
            } finally {
                btn.disabled = false;
            }
        }

        // Search functionality with debounce
        const searchBox = document.getElementById('globalSearch');
        searchBox.addEventListener('input', (e) => {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                performSearch(e.target.value);
            }, 200);
        });

        // Enter submits search, Shift+Enter inserts newline
        searchBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                clearTimeout(searchDebounceTimer);
                performSearch(searchBox.value);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const activeElement = document.activeElement;
            const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA';
            
            // Press '/' to focus search (on mobile, return to list view first)
            if (e.key === '/' && !isInputFocused) {
                e.preventDefault();
                if (isMobile()) showConversationList();
                document.getElementById('globalSearch').focus();
            }
            
            // Press 'Escape' to blur search and clear
            if (e.key === 'Escape') {
                document.activeElement.blur();
                if (searchTerm) {
                    document.getElementById('globalSearch').value = '';
                    performSearch('');
                }
            }
            
            // Navigate search results with n/p
            if (!isInputFocused && searchResults.length > 0) {
                if (e.key === 'n') {
                    e.preventDefault();
                    navigateSearch('next');
                } else if (e.key === 'p') {
                    e.preventDefault();
                    navigateSearch('prev');
                }
            }
            
            if (!isInputFocused) {
                const convItems = document.querySelectorAll('.conversation-item');
                const dir = e.key === 'j' ? 1 : e.key === 'k' ? -1 : 0;
                if (dir && convItems.length > 0) {
                    e.preventDefault();
                    selectedConvIndex = Math.max(0, Math.min(selectedConvIndex + dir, convItems.length - 1));
                    convItems.forEach(item => item.style.outline = 'none');
                    convItems[selectedConvIndex].style.outline = '2px solid #4a9eff';
                    convItems[selectedConvIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else if (e.key === 'Enter' && convItems[selectedConvIndex]) {
                    e.preventDefault();
                    convItems[selectedConvIndex].click();
                }
            }
            
            // Show help with ?
            if (e.key === '?' && !isInputFocused) {
                e.preventDefault();
                const help = document.getElementById('shortcutsHelp');
                help.classList.toggle('show');
                setTimeout(() => help.classList.remove('show'), 5000);
            }
        });

        // Auto-refresh every 30 seconds (skip when searching to preserve filtered results)
        setInterval(() => {
            if (!searchTerm) {
                loadConversations();
            }
        }, 30000);

        // Browser back/forward navigation on mobile
        window.addEventListener('popstate', (e) => {
            if (!isMobile()) return;
            if (e.state?.conv) {
                loadConversation(e.state.conv);
            } else {
                showConversationList();
            }
        });

        // Load conversations on page load
        loadConversations();
    </script>
</body>
</html>
